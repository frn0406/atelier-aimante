<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Aimanté — banc d'essai de l'interface</title>
<!--
  Banc d'essai de l'interface (local uniquement, Chrome avec --allow-file-access-from-files) :
  reprend le balisage et le CSS de ../index.html puis charge les scripts.

  Ancre : #drapeaux~code, drapeaux séparés par des points :
    dark / light   force data-theme sur la racine
    mock           thèmes et modules factices si aucun thème réel n'est chargé
    selftest       affiche la scène de contrôle du moteur (thème « selftest »)
    ai             simule window.claude (sample + downloads)
    fail=<code>    avec ai : l'appel à Claude échoue avec ce code
    fallback       force l'aperçu 2D (sans WebGL)
    nothree        ne charge pas Three.js
    free=<texte>   remplit « Ton thème » et lance Construire
  ex. app-dev.html#mock.ai.free=dragon~chateau-2-1-7
-->
</head>
<body>
<div id="dev-errors" style="position:fixed;left:0;right:0;bottom:0;z-index:99;max-height:40vh;overflow:auto;background:#b00020;color:#fff;font:12px/1.4 monospace;padding:0 8px;white-space:pre-wrap"></div>
<script>
(function () {
  const box = document.getElementById('dev-errors');
  const add = (msg) => { box.textContent += msg + '\n'; box.style.padding = '6px 8px'; };
  window.__devLog = add;
  window.addEventListener('error', (e) => add('ERREUR ' + (e.message || e) + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  window.addEventListener('unhandledrejection', (e) => add('PROMESSE ' + (e.reason && (e.reason.stack || e.reason.message || JSON.stringify(e.reason)))));
  const oe = console.error.bind(console);
  console.error = (...a) => { add('console.error ' + a.map((x) => (x && x.stack) || String(x)).join(' ')); oe(...a); };

  const raw = decodeURIComponent(location.hash.slice(1));
  const [flagPart, code] = raw.includes('~') ? raw.split('~') : [raw, ''];
  const flags = {};
  for (const f of flagPart.split('.').filter(Boolean)) {
    const i = f.indexOf('=');
    flags[i < 0 ? f : f.slice(0, i)] = i < 0 ? true : f.slice(i + 1);
  }
  window.__devFlags = flags;
  if (flags.dark) document.documentElement.setAttribute('data-theme', 'dark');
  if (flags.light) document.documentElement.setAttribute('data-theme', 'light');
  history.replaceState(null, '', code ? '#' + code : location.pathname);

  // Balisage et CSS de l'appli réelle.
  const xhr = new XMLHttpRequest();
  xhr.open('GET', '../index.html', false);
  xhr.send();
  const src = new DOMParser().parseFromString(xhr.responseText, 'text/html');
  for (const n of src.head.querySelectorAll('style, link[rel="stylesheet"]')) document.head.appendChild(n.cloneNode(true));
  const app = src.getElementById('app');
  document.body.insertBefore(document.importNode(app, true), box);

  const scripts = [];
  if (!flags.nothree) {
    scripts.push('https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js',
      'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js',
      'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js');
  }
  scripts.push('../js/pieces.js', '../js/builder.js',
    '../themes/a-habitat.js', '../themes/b-ville.js', '../themes/c-aventure.js',
    'selftest-scene.js', 'dev-mocks.js', flags.fallback ? null : '../js/viewer.js', '../js/app.js', 'dev-after.js');
  window.__devScripts = scripts.filter(Boolean);
})();
</script>
<script>
// Chargement séquentiel (fichiers absents tolérés : les autres agents écrivent en parallèle).
(function next() {
  const s = window.__devScripts.shift();
  if (!s) return;
  if (s === 'dev-mocks.js') { window.__devMocks(); return next(); }
  if (s === 'dev-after.js') { window.__devAfter(); return next(); }
  const el = document.createElement('script');
  el.src = s;
  el.onload = next;
  el.onerror = () => { if (!/themes\/|viewer\.js/.test(s)) window.__devLog('script introuvable : ' + s); next(); };
  document.body.appendChild(el);
})();

window.__devMocks = function () {
  const MT = window.MT;
  const flags = window.__devFlags;
  const real = MT.themeList.filter((t) => t.id !== 'selftest');
  if (flags.mock && !real.length) {
    // Modules factices (les vrais viennent des thèmes).
    MT.registerModule({
      id: 'tourelle', label: 'Tourelle', description: 'Tour carrée 1×1 à étages, toit pointu ou créneaux',
      params: { levels: { type: 'int', min: 1, max: 4, default: 2, label: 'Étages' }, roof: { type: 'enum', values: ['fleche', 'creneaux'], default: 'fleche', label: 'Toit' } },
      footprint: () => ({ w: 1, d: 1 }),
      build(b, p) {
        for (let l = 0; l < p.levels; l++) { b.step('Étage ' + (l + 1)); b.box(0, l, 0, { S: l === 0 ? 'arch' : 'window' }); }
        b.step('Toit');
        if (p.roof === 'fleche') b.pyramidRoof(0, p.levels, 0, 'TT'); else b.crenelRim(0, p.levels, 0, 1, 1);
      },
    });
    MT.registerModule({
      id: 'maisonnette', label: 'Maisonnette', description: 'Maison rectangulaire avec toit à deux pans',
      params: { len: { type: 'int', min: 1, max: 3, default: 2, label: 'Longueur' } },
      footprint: (p) => ({ w: p.len, d: 1 }),
      build(b, p) {
        b.step('Murs');
        b.room(0, 0, 0, p.len, 1, ({ side, i }) => (side === 'S' && i === 0 ? 'arch' : 'window'));
        b.step('Toit');
        b.gableRoof(0, 1, 0, p.len, 1, 'x');
      },
    });
    MT.registerModule({
      id: 'pyramide', label: 'Pyramide', description: 'Pyramide à base carrée n×n en triangles équilatéraux',
      params: { n: { type: 'int', min: 1, max: 2, default: 2, label: 'Côté' } },
      footprint: (p) => ({ w: p.n, d: p.n }),
      build(b, p) { b.step('Pyramide'); b.bigPyramid(0, 0, 0, p.n); },
    });
    MT.registerModule({
      id: 'wagon', label: 'Wagon', description: 'Plateau à roues avec deux cubes posés dessus',
      params: {}, footprint: () => ({ w: 2, d: 1 }),
      build(b) { b.step('Plateau'); b.car(0, 0, 'x'); b.step('Caisse'); b.box(0, MT.CAR.top, 0, {}); b.box(1, MT.CAR.top, 0, {}); },
    });
    const theme = (id, name, tagline, keywords, fn) => MT.registerTheme({ id, name, tagline, keywords, generate: fn });
    theme('chateau', 'Château fort', 'Tours, remparts crénelés et pont-levis', ['chateau', 'chevalier', 'princesse', 'roi', 'medieval', 'donjon', 'dragon'], (b, { size, rng }) => {
      const n = 1 + size;
      b.step('Rempart');
      b.room(0, 0, 0, n + 1, 2, 'solid');
      b.crenelRim(0, 1, 0, n + 1, 2);
      for (let i = 0; i < Math.min(size, 3); i++) b.tryBuild(() => b.module('tourelle', n + 3 + i * 2, 0, { levels: rng.int(1, 3), roof: rng.pick(['fleche', 'creneaux']) }));
      if (size >= 4) for (let i = 0; i < 4; i++) b.tryBuild(() => b.module('maisonnette', i * 3, 4, { len: 2 }));
      return { title: 'Château du dragon', summary: 'Un rempart crénelé et ses tourelles pointues.' };
    });
    theme('maison', 'Maison', 'Une maison à étages avec fenêtres et toit', ['maison', 'famille', 'villa', 'cabane'], (b, { size }) => {
      for (let i = 0; i < size; i++) b.tryBuild(() => b.module('maisonnette', i * 4, 0, { len: 2 + (i % 2) }));
      return { title: 'Rue des maisons', summary: 'Des maisonnettes alignées.' };
    });
    theme('egypte', 'Égypte', 'Pyramides et sphinx au bord du Nil', ['egypte', 'pyramide', 'pharaon', 'desert', 'momie'], (b, { size }) => {
      for (let i = 0; i < size; i++) b.tryBuild(() => b.module('pyramide', i * 3, 0, { n: 2 }));
      return { title: 'Vallée des pyramides', summary: 'Des pyramides dorées.' };
    });
    theme('train', 'Train', 'Locomotive et wagons sur plateaux à roues', ['train', 'wagon', 'locomotive', 'gare', 'rail'], (b) => {
      b.module('wagon', 0, 0, {});
      b.tryBuild(() => b.module('wagon', 3, 0, {}));
      b.tryBuild(() => b.module('tourelle', 6, 0, { levels: 2 }));
      return { title: 'Petit train', summary: 'Deux wagons et un château d’eau.' };
    });
    theme('ferme', 'Ferme', 'Grange, silo et enclos', ['ferme', 'vache', 'cochon', 'grange', 'tracteur'], (b, { size }) => {
      b.module('maisonnette', 0, 0, { len: 3 });
      for (let i = 0; i < size; i++) b.tryBuild(() => b.module('tourelle', i * 2, 3, { levels: 3 }));
      return { title: 'La ferme', summary: 'Une grange et ses silos.' };
    });
    theme('camping', 'Camping', 'Tentes en A autour du feu', ['camping', 'tente', 'foret', 'feu', 'scout'], (b, { size }) => {
      for (let i = 0; i < size + 1; i++) { b.step('Tente ' + (i + 1)); b.tryBuild(() => b.aFrame(i * 3, 0, 0, 2, 'z')); }
      return { title: 'Camp des scouts', summary: 'Des tentes en A.' };
    });
  }
  if (flags.ai) {
    const logBox = (m) => window.__devLog('[claude] ' + m);
    const sampleFn = function () { return Promise.reject({ code: 'invalid_request', message: 'stub' }); };
    sampleFn.json = function (prompt, opts) {
      window.__lastPrompt = prompt;
      window.__lastOpts = opts;
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => {
          if (flags.fail) return reject({ code: flags.fail, message: 'stub ' + flags.fail });
          const mods = MT.moduleList;
          const items = mods.slice(0, 4).map((m, i) => ({ module: m.id, x: 2 + i * 4, z: 2 + (i % 2) * 3, rot: 0, params: {}, label: m.label + ' du dragon' }));
          items.push({ module: 'inexistant', x: 0, z: 0, rot: 0, params: {} });
          resolve({ title: 'La grotte du dragon', summary: 'Un repaire de dragon avec ses tours et son trésor.', items });
        }, Number(flags.delay) || 1200);
        if (opts && opts.signal) opts.signal.addEventListener('abort', () => { clearTimeout(t); reject({ code: 'cancelled', message: 'abort' }); });
      });
    };
    window.claude = {
      use(name) {
        if (name === 'sample') return new Promise((r) => setTimeout(() => r(sampleFn), 50));
        if (name === 'downloads') return Promise.resolve({ save: (req) => { logBox('save ' + req.filename + ' ' + (req.data && (req.data.size || req.data.length))); return Promise.resolve({ status: 'saved' }); } });
        return Promise.resolve(null);
      },
    };
  }
};

window.__devAfter = function () {
  const flags = window.__devFlags;
  const MT = window.MT;
  const go = () => {
    if (flags.selftest) {
      const r = MT.generate('selftest', { packs: 2, seed: 1 });
      MT.app.showResult(r);
    }
    if (flags.free) {
      document.getElementById('free-text').value = decodeURIComponent(flags.free);
      setTimeout(() => document.getElementById('free-go').click(), 200);
    }
    if (flags.step != null) setTimeout(() => MT.app.setStep(Number(flags.step)), 400);
    if (flags.play) setTimeout(() => document.getElementById('sb-play').click(), 300);
    if (flags.keys) {
      setTimeout(() => {
        for (let i = 0; i < Number(flags.keys); i++) document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
        window.__devLog('étape après ' + flags.keys + ' × → : ' + MT.app.state.step);
      }, 900);
    }
    if (flags.hl) {
      setTimeout(() => {
        const li = document.querySelector('.part[data-type="' + flags.hl + '"]');
        li.dispatchEvent(new MouseEvent('mouseenter'));
        li.style.outline = '2px dashed #f60';
      }, 1200);
    }
    if (flags.dl) {
      setTimeout(() => {
        document.getElementById('dl-md').click();
        setTimeout(() => document.getElementById('tool-shot').click(), 400);
        const md = MT.appUtil.ficheMarkdown(MT.app.state.result, MT.app.state.code);
        window.__devLog('--- fiche (début) ---\n' + md.split('\n').slice(0, 26).join('\n'));
      }, 1500);
    }
    if (flags.hover) {
      // survol simulé d'une pièce : appelle directement le rappel du viewer via l'aperçu
      setTimeout(() => {
        const r = MT.app.state.result;
        const p = r && r.placements[Math.floor(r.placements.length / 2)];
        const st = document.getElementById('stage').getBoundingClientRect();
        if (p) MT.app.hover(p, { clientX: st.left + st.width * 0.5, clientY: st.top + st.height * 0.5 });
      }, 800);
    }
    if (flags.metrics) {
      setTimeout(() => {
        const vw = document.documentElement.clientWidth;
        const wide = [...document.querySelectorAll('body *')]
          .filter((el) => el.getBoundingClientRect().right > vw + 1 && !el.closest('.stage'))
          .slice(0, 8)
          .map((el) => el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + '.' + String(el.className).split(' ')[0] + ' r=' + Math.round(el.getBoundingClientRect().right));
        window.__devLog('innerWidth=' + innerWidth + ' clientWidth=' + vw + ' scrollWidth=' + document.documentElement.scrollWidth + ' | ' + wide.join(' ; '));
      }, 1500);
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else setTimeout(go, 0);
};
</script>
</body>
</html>
